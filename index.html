<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Quest</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>⚔️ Daily Quest</h1>
      <p>Turn your daily tasks into an adventure.</p>
    </header>

    <main>
      <section class="player-card">
        <h2>Tiến độ hoàn thành</h2>
        <div class="progress-bar">
          <div id="progress"></div>
        </div>
        <p id="progress-text">0% hoàn thành</p>
      </section>

      <section class="task-section">
        <h2>Nhiệm vụ hôm nay</h2>

        <form id="task-form">
          <input
            type="text"
            id="task-input"
            placeholder="Nhập nhiệm vụ..."
            required
          />
          <button type="submit">Thêm</button>
        </form>

        <ul id="task-list"></ul>

        <p id="task-count">0 / 0 nhiệm vụ hoàn thành</p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
